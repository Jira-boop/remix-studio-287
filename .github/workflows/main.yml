- name: เชื่อมต่อ RDP ผ่าน Ngrok (TCP Tunnel)
      run: |
        # ติดตั้ง Ngrok ผ่าน winget แบบอัตโนมัติ
        winget install --id Ngrok.Ngrok -e --silent
        
        # เพิ่ม Authtoken
        & "C:\Program Files\ngrok\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
        Write-Host "=========================================="
        Write-Host "Username: jira_zx"
        Write-Host "Password: 123789"
        Write-Host "MEGA Account: jirawatkaewninta@gmail.com"
        Write-Host "=========================================="
        Write-Host "กำลังสร้างอุโมงค์ Ngrok..."
        
        # รัน Ngrok พอร์ต 3389
        & "C:\Program Files\ngrok\ngrok.exe" tcp 3389
