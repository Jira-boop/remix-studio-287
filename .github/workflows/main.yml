name: Windows RDP (Fast Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
    - name: เปิดใช้งาน RDP และสร้างยูสเซอร์
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user jira_zx "" /add
        net localgroup administrators jira_zx /add
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\Lsa" /v LimitBlankPasswordUse /t REG_DWORD /d 0 /f

    - name: ดาวน์โหลด Ngrok
      run: |
        Invoke-WebRequest -Uri "https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive ngrok.zip -DestinationPath . -Force

    - name: เปิดไฟล์ Batch และ Playit.gg
      run: |
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        $targetBatch = "$desktopPath\WorldMergeFolder\world merge\รวมเซิร์ฟ.bat"
        if (Test-Path "C:\Program Files\bin\playit.exe") { Start-Process -FilePath "C:\Program Files\bin\playit.exe" }
        if (Test-Path $targetBatch) { Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$targetBatch`"" }

    - name: เชื่อมต่อ RDP และแสดงที่อยู่ทันที (Ngrok Direct Log)
      run: |
        .\ngrok.exe config add-authtoken 3L6zgkkTzPPCuVlRCQMVtQvBw4B_3Gqf4jTpF5ewwQELwDGxc
        Write-Host "=========================================="
        Write-Host "Username: jira_zx"
        Write-Host "Password: (ปล่อยว่างไว้)"
        Write-Host "คัดลอกที่อยู่ tcp:// ด้านล่างนี้ไปใช้ได้เลย:"
        Write-Host "=========================================="
        .\ngrok.exe tcp 3389 --log=stdout
