name: Windows RDP (Serveo Full)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
    - name: เปิดใช้งาน RDP และสร้างยูสเซอร์
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # ปิดนโยบายความซับซ้อนของรหัสผ่าน เพื่อให้ใช้รหัส 123789 ได้
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        # สร้างผู้ใช้และกำหนดรหัสผ่านเป็น 123789
        net user jira_zx "123789" /add
        net localgroup administrators jira_zx /add

    - name: ดาวน์โหลดและติดตั้ง MegaCmd
      run: |
        Invoke-WebRequest -Uri "https://mega.nz/MEGAsyncSetup64.exe" -OutFile "mega_setup.exe"
        Start-Process -FilePath "mega_setup.exe" -ArgumentList "/S" -Wait

    - name: โหลดโฟลเดอร์แรกไปไว้ที่ C:\Program Files
      run: |
        New-Item -ItemType Directory -Force -Path "C:\Program Files\MegaFolder"

    - name: โหลดโฟลเดอร์ที่สองมาไว้หน้า Desktop
      run: |
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        New-Item -ItemType Directory -Force -Path "$desktopPath\WorldMergeFolder"

    - name: เปิด Playit.gg และ batch file
      run: |
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        $targetBatch = "$desktopPath\WorldMergeFolder\world merge\รวมเซิร์ฟ.bat"
        if (Test-Path "C:\Program Files\bin\playit.exe") { Start-Process -FilePath "C:\Program Files\bin\playit.exe" }
        if (Test-Path $targetBatch) { Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$targetBatch`"" }

    - name: เชื่อมต่อ RDP ผ่าน Serveo (TCP Tunnel)
      run: |
        Write-Host "=========================================="
        Write-Host "Username: jira_zx"
        Write-Host "Password: 123789"
        Write-Host "กำลังสร้างพอร์ต RDP ผ่าน Serveo..."
        Write-Host "=========================================="
        ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
