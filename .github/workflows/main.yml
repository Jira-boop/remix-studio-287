name: Windows RDP (Minecraft Server Full)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
    - name: เปิดใช้งาน RDP และสร้างยูสเซอร์
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # ปิดนโยบายความซับซ้อนของรหัสผ่าน เพื่อให้ใช้รหัส 123789 ได้
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        # สร้างผู้ใช้และกำหนดรหัสผ่านเป็น 123789
        net user jira_zx "123789" /add
        net localgroup administrators jira_zx /add

    - name: ติดตั้ง MegaCmd และดาวน์โหลดไฟล์จริง
      run: |
        # ติดตั้ง MegaCmd แบบเงียบ
        Invoke-WebRequest -Uri "https://mega.nz/MEGAsyncSetup64.exe" -OutFile "mega_setup.exe"
        Start-Process -FilePath "mega_setup.exe" -ArgumentList "/S" -Wait
        
        # เพิ่ม path ของ mega-cmd เข้า environment ตัวแปรระบบ
        $env:PATH += ";C:\Program Files\MEGAcmd"
        
        # กำหนดลิงก์ Mega ของคุณตรงนี้ (แทนที่เครื่องหมายคำพูดด้วยลิงก์จริงของคุณ)
        $megaFolder1 = "ลิงก์_MEGA_สำหรับ_C_Program_Files"
        $megaFolder2 = "ลิงก์_MEGA_สำหรับ_Desktop_WorldMergeFolder"

        # โหลดไฟล์แรกไปไว้ที่ C:\Program Files
        Write-Host "กำลังดาวน์โหลดไฟล์แรกเข้า C:\Program Files..."
        New-Item -ItemType Directory -Force -Path "C:\Program Files\MegaFolder"
        # mega-get $megaFolder1 "C:\Program Files\MegaFolder"

        # โหลดไฟล์ที่สองมาไว้หน้า Desktop
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        Write-Host "กำลังดาวน์โหลดไฟล์ที่สองไปที่หน้า Desktop..."
        New-Item -ItemType Directory -Force -Path "$desktopPath\WorldMergeFolder"
        # mega-get $megaFolder2 "$desktopPath\WorldMergeFolder"

    - name: เปิด Playit.gg และ batch file
      run: |
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        $targetBatch = "$desktopPath\WorldMergeFolder\world merge\รวมเซิร์ฟ.bat"
        
        if (Test-Path "C:\Program Files\bin\playit.exe") { 
            Start-Process -FilePath "C:\Program Files\bin\playit.exe" 
        }
        
        if (Test-Path $targetBatch) { 
            Write-Host "กำลังรันไฟล์ batch..."
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$targetBatch`"" 
        }

    - name: เชื่อมต่อ RDP ผ่าน Serveo (TCP Tunnel)
      run: |
        Write-Host "=========================================="
        Write-Host "Username: jira_zx"
        Write-Host "Password: 123789"
        Write-Host "กำลังสร้างพอร์ต RDP ผ่าน Serveo..."
        Write-Host "=========================================="
        ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
