name: Windows RDP (Minecraft Server MediaFire Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
    - name: เปิดใช้งาน RDP และสร้างยูสเซอร์
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # ปิดนโยบายความซับซ้อนของรหัสผ่าน เพื่อให้ใช้รหัส 123789 ได้
        secedit /export /cfg C:\secpol.cfg
        (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
        secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
        
        # สร้างผู้ใช้และกำหนดรหัสผ่านเป็น 123789
        net user jira_zx "123789" /add
        net localgroup administrators jira_zx /add

    - name: ดึงลิงก์ตรงและดาวน์โหลดจาก MediaFire
      run: |
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        
        # ฟังก์ชันดึงลิงก์ดาวน์โหลดตรงจาก MediaFire
        function Get-MediaFireDirectLink {
            param ($Url)
            $webPage = Invoke-WebRequest -Uri $Url -UseBasicParsing
            $link = $webPage.Links | Where-Object { $_.id -eq "downloadButton" } | Select-Object -ExpandProperty href
            return $link
        }

        Write-Host "กำลังดึงลิงก์ playit_gg.zip..."
        $playitUrl = Get-MediaFireDirectLink "https://www.mediafire.com/file/1s9uey5cucgqdni/playit_gg.zip/file"
        Invoke-WebRequest -Uri $playitUrl -OutFile "$desktopPath\playit_gg.zip"
        Expand-Archive -Path "$desktopPath\playit_gg.zip" -DestinationPath "C:\Program Files" -Force

        Write-Host "กำลังดึงลิงก์ world merge.zip..."
        New-Item -ItemType Directory -Force -Path "$desktopPath\WorldMergeFolder"
        $worldUrl = Get-MediaFireDirectLink "https://www.mediafire.com/file/n6uetybhqo7dbq2/world+merge.zip/file"
        Invoke-WebRequest -Uri $worldUrl -OutFile "$desktopPath\WorldMergeFolder\world_merge.zip"
        Expand-Archive -Path "$desktopPath\WorldMergeFolder\world_merge.zip" -DestinationPath "$desktopPath\WorldMergeFolder" -Force
        
        Write-Host "ดาวน์โหลดและแตกไฟล์สำเร็จครบถ้วน!"

    - name: เปิด Playit.gg และ batch file
      run: |
        $desktopPath = [Environment]::GetFolderPath("Desktop")
        $targetBatch = "$desktopPath\WorldMergeFolder\world merge\รวมเซิร์ฟ.bat"
        
        if (Test-Path "C:\Program Files\bin\playit.exe") { 
            Start-Process -FilePath "C:\Program Files\bin\playit.exe" 
        } elseif (Test-Path "C:\Program Files\playit.exe") {
            Start-Process -FilePath "C:\Program Files\playit.exe"
        }
        
        if (Test-Path $targetBatch) { 
            Write-Host "กำลังรันไฟล์ รวมเซิร์ฟ.bat..."
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$targetBatch`"" 
        } else {
            Write-Host "ไม่พบไฟล์ รวมเซิร์ฟ.bat กรุณาตรวจสอบเส้นทางโฟลเดอร์"
        }

    - name: เชื่อมต่อ RDP ผ่าน Serveo (TCP Tunnel)
      run: |
        Write-Host "=========================================="
        Write-Host "Username: jira_zx"
        Write-Host "Password: 123789"
        Write-Host "กำลังสร้างพอร์ต RDP ผ่าน Serveo..."
        Write-Host "=========================================="
        ssh -o StrictHostKeyChecking=no -R super_vm:3389:localhost:3389 serveo.net
